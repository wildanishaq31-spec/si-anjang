<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111536"/>
      <stop offset="100%" stop-color="#1d265a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="4"/>

  <!-- Wallet / Vault Icon with Glow -->
  <g filter="url(#glow)">
    <!-- Wallet Body -->
    <rect x="110" y="150" width="292" height="212" rx="28" fill="url(#blueGrad)"/>
    <!-- Wallet Top Flap / Accent -->
    <path d="M 110 190 Q 256 220 402 190 L 402 178 Q 402 150 374 150 L 138 150 Q 110 150 110 178 Z" fill="#1d4ed8" opacity="0.6"/>
    
    <!-- Wallet Pocket Flap with Clasp -->
    <path d="M 280 216 L 396 216 C 410 216 422 228 422 242 L 422 270 C 422 284 410 296 396 296 L 280 296 C 266 296 254 284 254 270 L 254 242 C 254 228 266 216 280 216 Z" fill="#0f172a"/>
    <circle cx="340" cy="256" r="18" fill="url(#goldGrad)"/>
    <circle cx="340" cy="256" r="8" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Emerging Golden Coin -->
  <g filter="url(#glow)">
    <circle cx="256" cy="140" r="50" fill="url(#goldGrad)"/>
    <circle cx="256" cy="140" r="42" fill="none" stroke="#d97706" stroke-width="4"/>
    <text x="256" y="155" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="44" font-weight="900" fill="#78350f" text-anchor="middle">Rp</text>
  </g>

  <!-- Label at bottom -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">SI-ANJANGSANA</text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="1" text-anchor="middle">PKM CERMEE</text>
</svg>
